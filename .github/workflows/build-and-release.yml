name: Release Desktop App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Loka Clip ${{ github.ref_name }}"
          body: "See the assets below to download and install."
          draft: false
          prerelease: false

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: windows-x86_64
            args: ""
          - platform: macos-latest
            target: macos-x86_64
            args: "--target x86_64-apple-darwin"
          - platform: macos-latest
            target: macos-aarch64
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-22.04
            target: linux-x86_64
            args: ""
          - platform: ubuntu-22.04
            target: linux-aarch64
            args: "--target aarch64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: Rafi718/lokaclip_desktop
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{ matrix.platform == 'macos-latest' && matrix.target == 'macos-aarch64' && 'aarch64-apple-darwin' || '' }}
            ${{ matrix.platform == 'macos-latest' && matrix.target == 'macos-x86_64' && 'x86_64-apple-darwin' || '' }}
            ${{ matrix.platform == 'ubuntu-22.04' && matrix.target == 'linux-aarch64' && 'aarch64-unknown-linux-gnu' || '' }}

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Create .env file
        run: |
          echo "VITE_API_BASE_URL=https://api.lokaclip.pro/v1" > .env
          echo "VITE_APP_VERSION=${{ github.ref_name }}" >> .env
          echo "VITE_UPDATE_CHANNEL=stable" >> .env

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
