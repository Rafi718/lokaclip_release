name: Release Desktop App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Loka Clip ${{ github.ref_name }}"
          body: "See the assets below to download and install."
          draft: false
          prerelease: false

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: windows-x86_64
            args: ""
          - platform: macos-latest
            target: macos-x86_64
            args: "--target x86_64-apple-darwin"
          - platform: macos-latest
            target: macos-aarch64
            args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      # Check out the *tag*, not the branch tip. Without `ref` this built
      # whatever happened to be on main at the second the workflow started,
      # which is how v1.8.0 came to be published from a tree still carrying
      # version 1.7.8 — an empty release, recovered by re-tagging as v1.8.1
      # ninety seconds later. `scripts/release.mjs` pushes the matching tag to
      # lokaclip_desktop before it pushes this one, so the ref always exists.
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: Rafi718/lokaclip_desktop
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{ matrix.platform == 'macos-latest' && matrix.target == 'macos-aarch64' && 'aarch64-apple-darwin' || '' }}
            ${{ matrix.platform == 'macos-latest' && matrix.target == 'macos-x86_64' && 'x86_64-apple-darwin' || '' }}
            ${{ matrix.platform == 'ubuntu-22.04' && matrix.target == 'linux-aarch64' && 'aarch64-unknown-linux-gnu' || '' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Create .env file
        run: |
          echo "VITE_API_BASE_URL=https://api.lokaclip.pro/v1" > .env
          echo "VITE_APP_VERSION=${{ github.ref_name }}" >> .env
          echo "VITE_UPDATE_CHANNEL=stable" >> .env

      - name: Install frontend dependencies
        run: pnpm install

      # Smart Crop loads onnxruntime.dll, which imports MSVCP140,
      # MSVCP140_1, VCRUNTIME140 and VCRUNTIME140_1 — the Visual C++
      # runtime. None of those ship with Windows, and we install none of
      # them, so on a machine that has never had a Visual Studio
      # redistributable the load fails with ERROR_MOD_NOT_FOUND and every
      # clip in the render queue dies. A user hit exactly that without ever
      # asking for face tracking: the Podcast content preset enables it.
      #
      # The runner has Visual Studio, so take them from its redist folder —
      # the copy Microsoft licenses for redistribution — rather than
      # committing binaries or hosting them ourselves. `preload_vc_runtime`
      # in smartcrop/onnx.rs loads them from here by absolute path.
      - name: Bundle the Visual C++ runtime (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $dest = "src-tauri/resources/vcruntime"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $src = Get-ChildItem -Directory -ErrorAction SilentlyContinue `
            "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $src) { throw "VC redist folder not found on this runner" }
          Write-Host "Using $($src.FullName)"
          # Fail the build rather than ship a package that is quietly broken
          # for exactly the users who cannot diagnose it.
          foreach ($f in @("vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll","msvcp140_1.dll")) {
            $p = Join-Path $src.FullName $f
            if (-not (Test-Path $p)) { throw "missing $f in $($src.FullName)" }
            Copy-Item $p $dest -Force
          }
          Get-ChildItem $dest | Format-Table Name, Length

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Check the one URL every installed copy of Loka Clip actually calls.
  #
  # A release can be green in every build job and still leave the updater
  # broken, because `/releases/latest/` resolves to whichever release in this
  # repo is newest — not to this one. Publishing anything else here silently
  # steals that slot, the endpoint 404s, and nobody finds out until a user
  # reports that updates stopped working. That has already happened once.
  #
  # Fetching the endpoint the client fetches is the only check that would
  # have caught it.
  verify-updater:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Updater endpoint serves this release
        run: |
          EXPECTED="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${{ github.repository }}/releases/latest/download/latest.json"

          # GitHub caches the /latest redirect briefly, so a fresh release can
          # take a moment to surface. Retry rather than fail on a cold cache.
          for attempt in 1 2 3 4 5 6; do
            BODY=$(curl -sL --fail "$URL?cb=$RANDOM" 2>/dev/null) &&               SERVED=$(echo "$BODY" | jq -r '.version // empty') || SERVED=""
            echo "attempt $attempt: served='${SERVED:-<none>}' expected='$EXPECTED'"
            [ "$SERVED" = "$EXPECTED" ] && { echo "updater OK"; exit 0; }
            sleep 20
          done

          echo "::error::Updater endpoint does not serve $EXPECTED."
          echo "::error::Most likely another release in this repo is newer and"
          echo "::error::claimed /releases/latest. Binaries and other artifacts"
          echo "::error::belong in Rafi718/lokaclip-binaries, not here."
          exit 1
